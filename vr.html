<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VR - Torno Romi T240 (SENAI)</title>
    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      .btn-voltar {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        padding: 10px 18px;
        border-radius: 6px;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 0.95rem;
        font-weight: bold;
        border: 1px solid #ffffff;
        box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      }
      .instrucoes-vr {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 0.85rem;
        pointer-events: none;
        text-align: center;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <!-- Botão de retorno ao menu -->
    <a href="index.html" class="btn-voltar">← Voltar ao Menu</a>

    <!-- Mensagem de orientação -->
    <div class="instrucoes-vr">Alinhe a mira ciano sobre os pontos para selecionar e ver as informações</div>

    <a-scene vr-mode-ui="enabled: true">

      <!-- PAINEL SUPERIOR DE INFORMAÇÕES TÉCNICAS -->
      <a-entity id="painel-info" position="0 2.85 -3">
        <a-plane width="3.2" height="1.1" color="#111111" opacity="0.95" border="1px solid #00FFCC">
          <a-text 
            id="texto-painel" 
            value="LUBRIFICACAO ROMI T240\n\nPosicione a mira ciano sobre um dos\npontos (A, B, C, D, E ou F) para ver os detalhes." 
            align="center" 
            width="2.9" 
            color="#00FFCC" 
            position="0 0 0.01">
          </a-text>
        </a-plane>
      </a-entity>

      <!-- MODELO ESTRUTURAL DO TORNO ROMI T240 -->
      <a-entity id="torno-romi-t240" position="0 0 -3">
        
        <!-- Pés/Bases Inferiores (Azul Romi) -->
        <a-box position="-1.0 0.35 0" width="0.9" height="0.7" depth="1.1" color="#1B4965"></a-box>
        <a-box position="1.1 0.35 0" width="0.7" height="0.7" depth="1.1" color="#1B4965"></a-box>
        
        <!-- Carenagem Inferior Central (Branco/Creme) -->
        <a-box position="0.05 0.45 -0.1" width="1.2" height="0.4" depth="0.9" color="#F4F4F9"></a-box>

        <!-- Barramento e Guias de Aço Polido -->
        <a-box position="0.1 0.85 0" width="2.6" height="0.3" depth="0.7" color="#8D99AE"></a-box>
        <a-box position="0.1 1.02 0" width="2.5" height="0.05" depth="0.5" color="#D8E2DC"></a-box>

        <!-- Cabeçote Fixo (Esquerda - Branco e Azul) -->
        <a-box position="-0.9 1.45 0" width="0.8" height="0.9" depth="1.0" color="#F4F4F9"></a-box>
        <a-box position="-0.9 1.1 0.51" width="0.75" height="0.3" depth="0.02" color="#1B4965"></a-box>
        <a-plane position="-0.9 1.5 0.51" width="0.7" height="0.4" color="#E5E5E5"></a-plane>

        <!-- Placa de Castanhas -->
        <a-cylinder position="-0.4 1.45 0" rotation="0 0 90" radius="0.32" height="0.18" color="#4A5568"></a-cylinder>

        <!-- Escudo Superior Transparente -->
        <a-plane position="-0.1 1.85 0.1" rotation="-20 0 0" width="1.0" height="0.5" color="#E2E8F0" opacity="0.4" material="side: double"></a-plane>
        <a-box position="-0.1 2.1 0.1" width="1.05" height="0.06" depth="0.4" color="#F4F4F9"></a-box>

        <!-- Digital Readout (DRO / Painel Digital Superior) -->
        <a-box position="-0.9 2.25 0.2" width="0.35" height="0.25" depth="0.08" color="#2D3748"></a-box>
        <a-cylinder position="-0.9 2.05 0.2" radius="0.02" height="0.25" color="#A0AEC0"></a-cylinder>

        <!-- Carro Principal, Avental e Manípulo -->
        <a-box position="0.0 1.15 0" width="0.5" height="0.3" depth="0.8" color="#1B4965"></a-box>
        <a-box position="0.0 0.9 0.42" width="0.48" height="0.35" depth="0.1" color="#2B6CB0"></a-box>
        <a-cylinder position="-0.12 0.88 0.48" rotation="90 0 0" radius="0.09" height="0.04" color="#E2E8F0"></a-cylinder>

        <!-- Cabeçote Móvel (Direita) -->
        <a-box position="1.0 1.25 0" width="0.45" height="0.4" depth="0.5" color="#2B6CB0"></a-box>
        <a-cylinder position="0.7 1.28 0" rotation="0 0 90" radius="0.06" height="0.2" color="#CBD5E0"></a-cylinder>
        <a-cylinder position="1.23 1.28 0" rotation="0 0 90" radius="0.08" height="0.03" color="#E2E8F0"></a-cylinder>

        <!-- Proteção Traseira da Máquina -->
        <a-plane position="0.1 1.5 -0.52" width="2.7" height="1.2" color="#F4F4F9" material="side: double"></a-plane>
      </a-entity>

      <!-- PONTOS DE LUBRIFICAÇÃO REPOSICIONADOS COM PRECISÃO -->

      <!-- PONTO A: Barramento e Guias (Vermelho) -->
      <a-sphere class="clickable" position="0.3 1.12 -3.0" radius="0.1" color="#E74C3C"
        data-info="PONTO A: BARRAMENTO E GUIAS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: Camada fina com almotolia">
        <a-text value="A" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO B: Esferas dos Carros (Amarelo) -->
      <a-sphere class="clickable" position="0.0 1.35 -2.6" radius="0.1" color="#F1C40F"
        data-info="PONTO B: ESFERAS DOS CARROS\n\n- Lubrificante: Oleo ISO VG 68\n- Frequencia: Diaria\n- Metodo: 2 a 3 bombadas manuais">
        <a-text value="B" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#000"></a-text>
      </a-sphere>

      <!-- PONTO C: Cabeçote Fixo (Verde) -->
      <a-sphere class="clickable" position="-0.9 1.95 -3.0" radius="0.1" color="#2ECC71"
        data-info="PONTO C: CABECOTE FIXO\n\n- Lubrificante: Oleo ISO VG 32\n- Frequencia: Checar diario / Semestral\n- Qtd: 5,5 Litros (visor)">
        <a-text value="C" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO D: Caixa Norton (Azul Claro) -->
      <a-sphere class="clickable" position="-0.9 1.1 -2.4" radius="0.1" color="#3498DB"
        data-info="PONTO D: CAIXA NORTON\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca semestral\n- Qtd: Aprox. 1,3 Litros">
        <a-text value="D" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO E: Avental do Carro (Roxo - Centralizado na caixa do Avental) -->
      <a-sphere class="clickable" position="0.0 0.9 -2.35" radius="0.1" color="#9B59B6"
        data-info="PONTO E: AVENTAL DO CARRO\n\n- Lubrificante: Oleo ISO VG 150\n- Frequencia: Troca bimestral\n- Qtd: Aprox. 0,5 Litro">
        <a-text value="E" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- PONTO F: Engrenagens da Lira (Laranja/Graxa - Visível na lateral esquerda) -->
      <a-sphere class="clickable" position="-1.45 1.35 -2.6" radius="0.1" color="#E67E22"
        data-info="PONTO F: ENGRENAGENS DA LIRA\n\n- Lubrificante: Graxa NLGI 2\n- Frequencia: Anual / Necessidade\n- Metodo: Aplicacao manual leve">
        <a-text value="F" align="center" position="0 0 0.11" scale="0.6 0.6 0.6" color="#FFF"></a-text>
      </a-sphere>

      <!-- CÂMERA E MIRA CIANO COM EFEITO FUSE -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera look-controls="pointerLockEnabled: false">
          <a-entity
            cursor="fuse: true; fuseTimeout: 800"
            raycaster="objects: .clickable"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
            material="color: #00FFCC; shader: flat"
            animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
            animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 800; from: 1 1 1; to: 0.3 0.3 0.3"
            animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 150; to: 1 1 1">
          </a-entity>
        </a-camera>
      </a-entity>

      <!-- ILUMINAÇÃO DE AMBIENTE -->
      <a-sky color="#1A252F"></a-sky>
      <a-ambient-light color="#FFFFFF" intensity="0.85"></a-ambient-light>
      <a-directional-light position="-1 2 1" intensity="0.6"></a-directional-light>
    </a-scene>

    <!-- SCRIPT DE INTERAÇÃO -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const textoPainel = document.getElementById('texto-painel');
        const pontos = document.querySelectorAll('.clickable');

        pontos.forEach(ponto => {
          ponto.addEventListener('mouseenter', () => {
            const info = ponto.getAttribute('data-info');
            textoPainel.setAttribute('value', info);
            textoPainel.setAttribute('color', '#FFFFFF');
          });

          ponto.addEventListener('click', () => {
            const info = ponto.getAttribute('data-info');
            textoPainel.setAttribute('value', info);
            textoPainel.setAttribute('color', '#00FFCC');
          });
        });
      });
    </script>
  </body>
</html>
